spring:
  application:
    name: badmshot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://hserver2:5432/badmshot}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

security.roles.application-id-prefix: badmshot

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:}

badmshot:
  archive-dir: ${BADMSHOT_ARCHIVE_DIR:}
  archive:
    files-read-only: ${BADMSHOT_ARCHIVE_FILES_READ_ONLY:false}
  export:
    enabled: ${BADMSHOT_EXPORT_ENABLED:true}
  import:
    enabled: ${BADMSHOT_IMPORT_ENABLED:true}
  video:
    player: ${BADMSHOT_VIDEO_PLAYER:ffmpeg}
    player-path: ${BADMSHOT_VIDEO_PLAYER_PATH:ffmpeg}
    ffprobe-path: ${BADMSHOT_FFPROBE_PATH:ffprobe}
  index:
    enabled: ${BADMSHOT_INDEX_ENABLED:true}
    screenshots-count: 10
    margin-seconds: 7
    scale-percent: 100
    format: jpeg
    quality: 75
    threads: 2
    player: ${BADMSHOT_INDEX_PLAYER:ffmpeg}
  image:
    max-width: 3840
    thumbnail-quality: 0.78
  job:
    stale-timeout-seconds: 60
    heartbeat-seconds: 5
  rate-limit:
    min-seconds-between-frames: 3
    free-frames: 3
  top-frames-limit: 15
  profile-frames-limit: 200
  teaser:
    cache-days: 1
  views:
    cooldown-seconds: 300
  shares:
    view-cooldown-seconds: 300
    visitor-salt: ${BADMSHOT_SHARE_VISITOR_SALT:badmshot}
  filters:
    limit: 50

server:
  port: 8080

management:
  endpoints.web.exposure.include: prometheus, health, metrics
  prometheus.metrics.export.enabled: 'true'
  metrics:
    enable:
      jvm: 'true'
